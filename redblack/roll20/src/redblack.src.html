<!-- 적과 흑 (한국어) — 세로 830px. 배치: 공식 「날조 미스터리 TRPG 적과 흑」 캐릭터 시트를 세로로. 목업: redblack/roll20/mockup.html
     @ 표시 자리는 build.py 가 채운다. 주사위 대신 트럼프: 카드 패드로 낸 카드를 고르고, 마법 말풍선이 〔기동〕 조건을 계산한다. -->
<input type="hidden" name="attr_sheet_version" value="0">
<div class="rb">

  <!-- 1단: 자기 증명 + 제목 · 상세 정보 | 초상 -->
  <div class="r1">
    <div class="idn">
      <div class="sec"><b>자기 증명</b><i>IDENTITY</i></div>
      <div class="ir orn"><b>계보</b><div class="f"><input type="text" name="attr_lineage" title="계보"></div></div>
      <div class="ir orn nm"><b>이름·칭호</b><div class="f"><input type="text" name="attr_character_name" title="이름·칭호"></div></div>
      <div class="ir orn"><b>작위</b><div class="f"><div class="two">
        <span class="seg"><input type="radio" class="hid" name="attr_rank" value="" checked><label class="sgk"><input type="radio" name="attr_rank" value="영주"><span>영주</span></label><label class="sgk"><input type="radio" name="attr_rank" value="추기경"><span>추기경</span></label></span><span></span>
        <b>성별·나이</b><input type="text" name="attr_gender_age" title="성별·나이"></div></div></div>
      <div class="ir orn"><b>위장·파벌</b><div class="f"><input type="text" name="attr_disguise" title="위장·파벌"></div></div>
      <div class="ir orn"><b>출신</b><div class="f"><input type="text" name="attr_origin" title="출신"></div></div>
      <div class="ir orn"><b>원리</b><div class="f"><input type="text" name="attr_principle" title="원리"></div></div>
      <div class="ir orn"><b>마법 체계</b><div class="f"><div class="tri"><input type="text" name="attr_ms1" title="마법 체계 1"><span>/</span><input type="text" name="attr_ms2" title="마법 체계 2"><span>/</span><input type="text" name="attr_ms3" title="마법 체계 3"></div></div></div>
      <div class="lower">
        <div class="logo"><div class="v">날조 미스터리 TRPG</div><div class="big"><em>적</em>과 흑</div><div class="v">캐릭터 시트</div></div>
        <div class="det orn"><span class="tg">상세 정보</span><textarea name="attr_detail" title="상세 정보"></textarea></div>
      </div>
    </div>
    <div class="por">
      <div class="sec"><b>초상</b><i>PORTRAIT</i></div>
      <div class="lm"><label class="lmk orn"><b>로직</b><input type="number" name="attr_logic" title="로직"></label><label class="lmk orn"><b>매직</b><input type="number" name="attr_magic" title="매직"></label></div>
      <div class="portrait orn"><img name="attr_character_avatar" alt=""></div>
    </div>
  </div>

  <!-- 2단: HP · 마력 (+ 사건 보고서 줄: 현재 값 · 영광) -->
  <div class="sec"><b>HP · 마력</b><i>HP / ETHER</i></div>
  <div class="hpr">
    <div class="hp orn"><b>HP</b><div class="f">초기치 /<input type="number" name="attr_hp_init" title="HP 초기치"><span class="sp"></span>복원치 /<input type="number" name="attr_hp_restore" title="HP 복원치"></div></div>
    <div class="hp orn"><b>흑의 마력</b><div class="f">초기치 /<input type="number" name="attr_mb_init" title="흑의 마력 초기치"></div></div>
    <div class="hp orn"><b class="rbg">적의 마력</b><div class="f">초기치 /<input type="number" name="attr_mr_init" title="적의 마력 초기치"></div></div>
  </div>
  <div class="rep"><span>사건 보고서</span>
    <label class="rpk">HP<span class="now"><input type="number" name="attr_hp" title="현재 HP"><small>/ <span name="attr_hp_init"></span></small></span></label>
    <label class="rpk">흑의 마력<input type="number" name="attr_mb" title="현재 흑의 마력"></label>
    <label class="rpk r">적의 마력<input type="number" name="attr_mr" title="현재 적의 마력"></label>
    <label class="rpk">영광<input type="number" name="attr_glory" value="5" title="영광 (초기 5 · 이츠와리 10 이면 패배)"></label>
    <span class="rpb"><label class="kil" title="살해됨 (HP 0)"><input type="checkbox" class="kx" name="attr_killed" value="1">살해</label>
      <button type="action" class="pbtn" name="act_hit" title="받은 대미지를 HP 에 반영 (실드 · 브레이크 · 리벤지 · 살해)">피해</button>
      <button type="action" class="pbtn" name="act_rest" title="재초기화의 복원: HP + 복원치, 살해 해제">복원</button></span>
  </div>

  <!-- 카드 패드 띠 -->
  <div class="strip">
    <div class="sr">
      <span class="tl">흑</span><!--@PAD_B-->
      <span class="sp"></span>
      <span class="tl">공개</span><span class="seg"><label class="sgk"><input type="radio" name="attr_roll_display_to" value=" " checked><span>모두에게</span></label><label class="sgk"><input type="radio" name="attr_roll_display_to" value="/w gm "><span>GM에게</span></label></span>
    </div>
    <div class="sr">
      <span class="tl rt">적</span><!--@PAD_R-->
      <span class="sp"></span>
      <button type="roll" class="gmb" name="roll_gmw" title="GM 에게 귓속말 (물음 창)" value="/w gm &{template:redblack} {{title=GM 에게}} {{en=WHISPER}} {{plain=?{GM 에게 귓속말}}}"><i></i>GM 귓속말</button>
    </div>
    <div class="sr">
      <span class="tl">낸 카드</span><div class="hand"><!--@HAND--></div>
      <span class="sum">흑 <span class="sv" name="attr_sum_b">0</span> · <span class="r">적 <span class="sv" name="attr_sum_r">0</span></span> · <span name="attr_sum_n">0</span>장</span>
      <button type="action" class="pbtn dk" name="act_endr" title="낸 카드의 암시 · 총마력으로 결말 마법 (기동 뒤 마력 0)">결말 마법</button>
      <button type="action" class="pbtn" name="act_clr">비우기</button>
    </div>
    <div class="sr">
      <span class="tl">고발</span>
      <span class="ckn">위력<input type="number" name="attr_acc_power" title="위력"></span>
      <span class="ckn">횟수<input type="number" name="attr_acc_count" title="횟수"></span>
      <button type="action" class="pbtn dk" name="act_atk">고발 공격</button>
      <span class="sp"></span>
      <span class="ckn" title="〈어택: X〉 내 공격 대미지 +X (1 이상일 때)">어택<input type="number" name="attr_attack" title="어택"></span>
      <span class="ckn" title="〈실드: X〉 받는 공격 · 리벤지 대미지 −X">실드<input type="number" name="attr_shield" title="실드"></span>
      <span class="ckn" title="〈브레이크: X〉 상대의 실드를 X 까지 무효">브레이크<input type="number" name="attr_break" title="브레이크"></span>
      <span class="ckn" title="〈리벤지: X〉 공격으로 1 이상 받으면 상대 HP −X">리벤지<input type="number" name="attr_revenge" title="리벤지"></span>
    </div>
  </div>

  <!-- 3단: 문장 -->
  <div class="sec"><b>문장</b><i>UNLOCK</i></div>
  <div class="g3">
<!--@CRESTS-->
  </div>

  <!-- 4단: 기본 선언 -->
  <div class="sec"><b>기본 선언</b><i>BASIC CALLING</i></div>
  <div class="g3">
<!--@BASIC-->
  </div>

  <!-- 5단: 상급 선언 -->
  <div class="sec"><b>상급 선언</b><i>NOBLE CALLING</i></div>
  <div class="g3">
<!--@NOBLE-->
  </div>

  <!-- 6단: 권한 마법 -->
  <div class="sec"><b>권한 마법</b><i>BATTLE MAGIC</i></div>
  <div class="g3">
<!--@AUTH-->
  </div>
</div>
